version: '3.8'

services:
  # --- Топология A: 3 маленьких инстанса за Nginx ---
  app-small-1:
    build: .
    environment:
      - JAVA_OPTS=-Xmx256m -XX:ActiveProcessorCount=1
  app-small-2:
    build: .
    environment:
      - JAVA_OPTS=-Xmx256m -XX:ActiveProcessorCount=1
  app-small-3:
    build: .
    environment:
      - JAVA_OPTS=-Xmx256m -XX:ActiveProcessorCount=1

  balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-small-1
      - app-small-2
      - app-small-3

  # --- Топология B: 1 крупный инстанс ---
  app-large:
    build: .
    ports:
      - "8081:8080"
    environment:
      - JAVA_OPTS=-Xmx1024m -XX:ActiveProcessorCount=3