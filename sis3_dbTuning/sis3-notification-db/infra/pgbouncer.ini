[databases]
notif = host=127.0.0.1 port=5432 dbname=notif
notif_ro = host=127.0.0.1 port=5433 dbname=notif

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 8
max_client_conn = 2000
reserve_pool_size = 0
server_reset_query =
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
logfile = /var/run/sis3/pgbouncer.log
pidfile = /var/run/sis3/pgbouncer.pid
unix_socket_dir = /var/run/sis3
